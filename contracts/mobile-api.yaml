components:
  securitySchemes:
    mobileBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Short-lived device-bound mobile access token; never a Web session or MCP token.
  parameters:
    AppVersion:
      name: X-Yingge-App-Version
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 64}
    VersionCode:
      name: X-Yingge-Version-Code
      in: header
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    Platform:
      name: X-Yingge-Platform
      in: header
      required: true
      schema: {$ref: '#/components/schemas/MobilePlatform'}
    DeviceInstanceId:
      name: X-Yingge-Device-Id
      in: header
      required: true
      schema: {type: string, format: uuid}
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema: {type: string, format: uuid}
    CustomerId:
      name: customerId
      in: path
      required: true
      schema: {type: string, format: uuid}
    DealRequestId:
      name: requestId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ReleaseId:
      name: releaseId
      in: path
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 160}
    ExpectedVersion:
      name: If-Match-Version
      in: header
      required: true
      schema: {type: integer, format: int64, minimum: 0}
  responses:
    ApiError:
      description: Structured API error. Cross-organization resources are not disclosed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    BusinessPayload:
      description: Strongly typed employee business response; concrete DTO is frozen in the generated client model.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/BusinessPayload'}
  requestBodies:
    BusinessPayload:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/BusinessPayload'}
  schemas:
    BusinessPayload:
      type: object
      description: Compatibility envelope for pre-existing employee APIs; clients define named DTOs and never use a generic proxy.
      additionalProperties: true
    MobilePlatform:
      type: string
      enum: [ANDROID, IOS]
    MobileLoginRequest:
      type: object
      additionalProperties: false
      required: [username, password, deviceName]
      properties:
        username: {type: string, minLength: 1, maxLength: 160}
        password: {type: string, minLength: 1, maxLength: 200, writeOnly: true}
        deviceName: {type: string, minLength: 1, maxLength: 160}
    RegistrationOptionsRequest:
      type: object
      additionalProperties: false
      required: [registrationCode]
      properties:
        registrationCode: {type: string, minLength: 1, maxLength: 100}
    RegistrationTeam:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
    RegistrationOptions:
      type: object
      additionalProperties: false
      required: [teams]
      properties:
        teams:
          type: array
          items: {$ref: '#/components/schemas/RegistrationTeam'}
    MobileRegisterRequest:
      type: object
      additionalProperties: false
      required: [username, realName, password, registrationCode, teamId]
      properties:
        username: {type: string, minLength: 1, maxLength: 100}
        realName: {type: string, minLength: 1, maxLength: 120}
        password: {type: string, minLength: 1, maxLength: 200, writeOnly: true}
        registrationCode: {type: string, minLength: 1, maxLength: 100}
        teamId: {type: string, format: uuid}
    RegistrationResult:
      type: object
      additionalProperties: false
      required: [userId, membershipId, username, realName, role, teamId, teamName]
      properties:
        userId: {type: string, format: uuid}
        membershipId: {type: string, format: uuid}
        username: {type: string}
        realName: {type: string}
        role: {type: string, enum: [MEMBER]}
        teamId: {type: string, format: uuid}
        teamName: {type: string}
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword: {type: string, minLength: 1, maxLength: 200, writeOnly: true}
        newPassword: {type: string, minLength: 1, maxLength: 200, writeOnly: true}
    MobileRefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken: {type: string, minLength: 32, maxLength: 512, writeOnly: true}
    MobileTokenResponse:
      type: object
      required: [accessToken, accessExpiresAt, refreshToken, refreshExpiresAt, actor]
      properties:
        accessToken: {type: string, writeOnly: true}
        accessExpiresAt: {type: string, format: date-time}
        refreshToken: {type: string, writeOnly: true}
        refreshExpiresAt: {type: string, format: date-time}
        actor: {$ref: '#/components/schemas/Actor'}
    Actor:
      type: object
      required: [userId, membershipId, organizationId, username, displayName, roles, passwordChangeRequired]
      properties:
        userId: {type: string, format: uuid}
        membershipId: {type: string, format: uuid}
        organizationId: {type: string, format: uuid}
        username: {type: string}
        displayName: {type: string}
        roles:
          type: array
          uniqueItems: true
          items: {type: string, enum: [ORG_ADMIN, TEAM_MANAGER, MEMBER, VIEWER]}
        passwordChangeRequired: {type: boolean}
    MobileDevice:
      type: object
      required: [id, platform, deviceName, appVersion, current, createdAt, lastUsedAt]
      properties:
        id: {type: string, format: uuid}
        platform: {$ref: '#/components/schemas/MobilePlatform'}
        deviceName: {type: string}
        appVersion: {type: string}
        current: {type: boolean}
        createdAt: {type: string, format: date-time}
        lastUsedAt: {type: string, format: date-time}
        revokedAt: {type: [string, 'null'], format: date-time}
    MobileBootstrap:
      type: object
      required: [actor, serverTime, organizationTimeZone, availableModes, capabilities, unread]
      properties:
        actor: {$ref: '#/components/schemas/Actor'}
        serverTime: {type: string, format: date-time}
        organizationTimeZone: {type: string, example: Asia/Shanghai}
        availableModes:
          type: array
          uniqueItems: true
          minItems: 1
          items: {type: string, enum: [EMPLOYEE, ADMIN]}
        capabilities:
          type: array
          uniqueItems: true
          items: {type: string}
        unread:
          type: object
          additionalProperties: false
          required: [urgentReminders, notifications]
          properties:
            urgentReminders: {type: integer, minimum: 0}
            notifications: {type: integer, minimum: 0}
    AdminOverview:
      type: object
      additionalProperties: false
      required: [pendingDealRequests, pendingClassificationReviews, dueOwnershipDeadlines, openPoolEntries, pendingSecondLineRecruitments, pendingPerformanceClaims, pendingPerformanceActivities, overdueConsultationFeedback, failedIntelligenceJobs, generatedAt]
      properties:
        pendingDealRequests: {type: integer, format: int64, minimum: 0}
        pendingClassificationReviews: {type: integer, format: int64, minimum: 0}
        dueOwnershipDeadlines: {type: integer, format: int64, minimum: 0}
        openPoolEntries: {type: integer, format: int64, minimum: 0}
        pendingSecondLineRecruitments: {type: integer, format: int64, minimum: 0}
        pendingPerformanceClaims: {type: integer, format: int64, minimum: 0}
        pendingPerformanceActivities: {type: integer, format: int64, minimum: 0}
        overdueConsultationFeedback: {type: integer, format: int64, minimum: 0}
        failedIntelligenceJobs: {type: integer, format: int64, minimum: 0}
        generatedAt: {type: string, format: date-time}
    DashboardGreeting:
      type: object
      additionalProperties: false
      required: [salutation, subtitle, generatedByAi, validUntil, traceId]
      properties:
        salutation: {type: string}
        subtitle: {type: string}
        generatedByAi: {type: boolean}
        validUntil: {type: string, format: date-time}
        traceId: {type: string}
    MobileCustomerInsight:
      type: object
      additionalProperties: false
      required: [content, generatedAt, timelineUpdatedAt, traceId]
      properties:
        content: {type: string}
        generatedAt: {type: string, format: date-time}
        timelineUpdatedAt: {type: string, format: date-time}
        traceId: {type: string}
    PushRegistrationRequest:
      type: object
      additionalProperties: false
      required: [provider, registrationId]
      properties:
        provider: {type: string, enum: [UNIPUSH]}
        registrationId: {type: string, minLength: 16, maxLength: 2048, writeOnly: true}
        vendor: {type: string, maxLength: 80}
    NotificationPreferences:
      type: object
      additionalProperties: false
      required: [urgentReminders, tasks, consultations, announcements, releases]
      properties:
        urgentReminders: {type: boolean}
        tasks: {type: boolean}
        consultations: {type: boolean}
        announcements: {type: boolean}
        releases: {type: boolean}
    WebSessionTicketRequest:
      type: object
      additionalProperties: false
      required: [target]
      properties:
        target: {type: string, enum: [QQ_WORKBENCH, OAUTH_APPROVAL, AGENT_APPROVAL]}
    WebSessionTicketResponse:
      type: object
      required: [ticket, exchangeUrl, expiresAt]
      properties:
        ticket: {type: string, writeOnly: true}
        exchangeUrl: {type: string, pattern: '^/api/v1/mobile/web-sessions/exchange$'}
        expiresAt: {type: string, format: date-time}
    MobileAppRelease:
      type: object
      required: [id, platform, versionCode, versionName, minimumSupportedVersionCode, mandatory, notes]
      properties:
        id: {type: string, format: uuid}
        platform: {$ref: '#/components/schemas/MobilePlatform'}
        versionCode: {type: integer, format: int64, minimum: 1}
        versionName: {type: string}
        minimumSupportedVersionCode: {type: integer, format: int64, minimum: 1}
        mandatory: {type: boolean}
        notes: {type: string}
        apkSize: {type: [integer, 'null'], format: int64, minimum: 0}
        apkSha256: {type: [string, 'null'], pattern: '^[a-f0-9]{64}$'}
        manifestSignature: {type: [string, 'null']}
    DealState:
      type: string
      enum: [NONE, PENDING, WON]
    DealRequestStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]
    DealRequest:
      type: object
      required: [id, customerId, applicantMembershipId, status, requestedAt, version]
      properties:
        id: {type: string, format: uuid}
        customerId: {type: string, format: uuid}
        customerName: {type: string}
        teamName: {type: [string, 'null']}
        ownerDisplayName: {type: [string, 'null']}
        applicantMembershipId: {type: string, format: uuid}
        applicantDisplayName: {type: [string, 'null']}
        status: {$ref: '#/components/schemas/DealRequestStatus'}
        requestedAt: {type: string, format: date-time}
        reviewedAt: {type: [string, 'null'], format: date-time}
        reviewerMembershipId: {type: [string, 'null'], format: uuid}
        version: {type: integer, format: int64, minimum: 0}
    DealRequestPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items: {$ref: '#/components/schemas/DealRequest'}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1}
        totalElements: {type: integer, format: int64, minimum: 0}
        totalPages: {type: integer, minimum: 0}
    Customer:
      type: object
      required: [id, fullName, dealState, canRequestDeal, createdAt, updatedAt, version]
      properties:
        id: {type: string, format: uuid}
        fullName: {type: string}
        nickname: {type: [string, 'null']}
        school: {type: [string, 'null']}
        major: {type: [string, 'null']}
        grade: {type: [string, 'null']}
        currentStatus: {type: [string, 'null']}
        dealState: {$ref: '#/components/schemas/DealState'}
        canRequestDeal: {type: boolean}
        dealRequestedAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        version: {type: integer, format: int64, minimum: 0}
    FieldError:
      type: object
      required: [field, message]
      properties:
        field: {type: string}
        message: {type: string}
    ApiError:
      type: object
      required: [code, message, fieldErrors, traceId]
      properties:
        code: {type: string}
        message: {type: string}
        fieldErrors:
          type: array
          items: {$ref: '#/components/schemas/FieldError'}
        traceId: {type: string}
