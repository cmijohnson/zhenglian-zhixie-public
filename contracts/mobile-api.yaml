openapi: 3.1.0
info:
  title: Yingge Cloud Mobile API
  version: 2026.08.26.17
  description: |
    Android and iOS contract for device authentication, mobile bootstrap, push,
    QQ WebView tickets, application releases, customer reads and the simplified
    deal approval flow. Existing employee business APIs remain available under
    /api/v1 and use the same Mobile Bearer authentication.
    Retired business-cycle and deal-forecast write operations return the stable
    error code FEATURE_RETIRED and never create new records.
servers:
  - url: "{scheme}://{host}"
    variables:
      scheme:
        default: http
        enum: [http, https]
      host:
        default: 127.0.0.1
security:
  - mobileBearer: []
x-mobile-bearer-required-headers:
  - X-Yingge-Device-Id
  - X-Yingge-Platform
  - X-Yingge-App-Version
  - X-Yingge-Version-Code
x-native-client-operations:
  # This list is the fail-closed native client surface. CI compares it
  # bidirectionally with the Android and iOS endpoint catalogs.
  - "ANDROID,IOS|POST|/api/v1/mobile/auth/registration-options"
