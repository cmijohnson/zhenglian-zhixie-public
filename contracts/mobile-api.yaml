tags:
  - name: MobileAuth
  - name: MobileDevice
  - name: MobileBootstrap
  - name: MobilePush
  - name: MobileWebSession
  - name: MobileRelease
  - name: Customer
  - name: DealRequest
  - name: EmployeeBusiness
paths:
  /api/v1/mobile/auth/registration-options:
    post:
      tags: [MobileAuth]
      operationId: mobileRegistrationOptions
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegistrationOptionsRequest'}
      responses:
        '200':
          description: Active teams permitted by the registration code.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RegistrationOptions'}
        '400': {$ref: '#/components/responses/ApiError'}
        '409': {$ref: '#/components/responses/ApiError'}
  /api/v1/mobile/auth/register:
    post:
      tags: [MobileAuth]
      operationId: mobileRegister
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MobileRegisterRequest'}
      responses:
        '201':
          description: Account created. The client signs in through mobileLogin afterwards.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RegistrationResult'}
        '400': {$ref: '#/components/responses/ApiError'}
        '409': {$ref: '#/components/responses/ApiError'}
  /api/v1/mobile/auth/login:
    post:
      tags: [MobileAuth]
      operationId: mobileLogin
      security: []
      parameters:
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/VersionCode'
        - $ref: '#/components/parameters/Platform'
        - $ref: '#/components/parameters/DeviceInstanceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileLoginRequest'
      responses:
        '200':
          description: Device session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenResponse'
        '401': {$ref: '#/components/responses/ApiError'}
  /api/v1/mobile/auth/refresh:
    post:
      tags: [MobileAuth]
      operationId: mobileRefresh
      security: []
      parameters:
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/VersionCode'
        - $ref: '#/components/parameters/Platform'
        - $ref: '#/components/parameters/DeviceInstanceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileRefreshRequest'
      responses:
        '200':
          description: Rotated access and refresh tokens. The submitted refresh token is invalid after success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenResponse'
        '401': {$ref: '#/components/responses/ApiError'}
        '409': {$ref: '#/components/responses/ApiError'}
  /api/v1/mobile/auth/logout:
    post:
      tags: [MobileAuth]
      operationId: mobileLogout
      responses:
        '204': {description: Current device session revoked.}
        '401': {$ref: '#/components/responses/ApiError'}
  /api/v1/auth/password:
    post:
      tags: [MobileAuth]
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordChangeRequest'}
      responses:
        '204': {description: Password changed; every Web and mobile session is revoked.}
        '400': {$ref: '#/components/responses/ApiError'}
        '401': {$ref: '#/components/responses/ApiError'}
  /api/v1/mobile/auth/devices:
    get:
      tags: [MobileDevice]
      operationId: listMobileDevices
      responses:
        '200':
          description: Devices belonging to the current user.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/MobileDevice'}
        '401': {$ref: '#/components/responses/ApiError'}
  /api/v1/mobile/auth/devices/{deviceId}:
    delete:
      tags: [MobileDevice]
      operationId: revokeMobileDevice
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '204': {description: Device and all of its tokens revoked.}
        '401': {$ref: '#/components/responses/ApiError'}
        '404': {$ref: '#/components/responses/ApiError'}
  /api/v1/mobile/bootstrap:
    get:
      tags: [MobileBootstrap]
      operationId: getMobileBootstrap
      responses:
        '200':
          description: Current actor, capability flags and server time.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MobileBootstrap'}
        '401': {$ref: '#/components/responses/ApiError'}
  /api/v1/mobile/admin/overview:
    get:
      tags: [MobileBootstrap]
      operationId: getMobileAdminOverview
      responses:
        '200':
          description: Organization-scoped native management todo aggregation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminOverview'}
        '403': {$ref: '#/components/responses/ApiError'}
  /api/v1/mobile/dashboard/greeting:
    post:
      tags: [MobileBootstrap]
      operationId: getMobileDashboardGreeting
      responses:
        '200':
          description: Server-time-calibrated salutation and cached AI subtitle.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DashboardGreeting'}
        '401': {$ref: '#/components/responses/ApiError'}
  /api/v1/mobile/customers/{customerId}/insight:
    post:
      tags: [Assistant]
      operationId: getMobileCustomerInsight
      parameters: [{$ref: '#/components/parameters/CustomerId'}]
      responses:
        '200':
          description: Stable JSON customer insight for the current timeline version.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MobileCustomerInsight'}
        '401': {$ref: '#/components/responses/ApiError'}
        '403': {$ref: '#/components/responses/ApiError'}
        '404': {$ref: '#/components/responses/ApiError'}
  /api/v1/mobile/devices/push-registration:
    post:
      tags: [MobilePush]
      operationId: registerPushDevice
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PushRegistrationRequest'}
      responses:
        '204': {description: Push registration stored encrypted.}
        '400': {$ref: '#/components/responses/ApiError'}
        '401': {$ref: '#/components/responses/ApiError'}
    delete:
      tags: [MobilePush]
      operationId: unregisterPushDevice
      responses:
        '204': {description: Push registration revoked.}
        '401': {$ref: '#/components/responses/ApiError'}
  /api/v1/mobile/devices/notification-preferences:
    put:
      tags: [MobilePush]
      operationId: updateMobileNotificationPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NotificationPreferences'}
      responses:
        '200':
          description: Saved preferences.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationPreferences'}
        '400': {$ref: '#/components/responses/ApiError'}
        '401': {$ref: '#/components/responses/ApiError'}
  /api/v1/mobile/web-sessions:
    post:
      tags: [MobileWebSession]
      operationId: createMobileWebSessionTicket
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WebSessionTicketRequest'}
      responses:
        '201':
          description: Single-use ticket valid for at most 60 seconds.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebSessionTicketResponse'}
        '400': {$ref: '#/components/responses/ApiError'}
        '401': {$ref: '#/components/responses/ApiError'}
  /api/v1/mobile/web-sessions/exchange:
    post:
      tags: [MobileWebSession]
      operationId: exchangeMobileWebSessionTicket
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [ticket]
              properties:
                ticket: {type: string, minLength: 32, maxLength: 512}
      responses:
        '303':
          description: Sets a short-lived HttpOnly path-scoped Web session and redirects to the approved path.
          headers:
            Location: {schema: {type: string}}
        '400': {$ref: '#/components/responses/ApiError'}
        '409': {$ref: '#/components/responses/ApiError'}
  /api/v1/mobile/app-releases/current:
    get:
      tags: [MobileRelease]
      operationId: getCurrentMobileRelease
      parameters:
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/VersionCode'
        - $ref: '#/components/parameters/Platform'
      responses:
        '200':
          description: Latest compatible build and update policy.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MobileAppRelease'}
        '204': {description: No release configured for this platform.}
        '401': {$ref: '#/components/responses/ApiError'}
  /api/v1/mobile/app-releases/{releaseId}/apk:
    get:
      tags: [MobileRelease]
      operationId: downloadAndroidRelease
      parameters:
        - $ref: '#/components/parameters/ReleaseId'
      responses:
        '200':
          description: Signed Android APK. iOS builds are installed manually and never returned here.
          content:
            application/vnd.android.package-archive:
              schema: {type: string, format: binary}
        '404': {$ref: '#/components/responses/ApiError'}
  /api/v1/customers/{customerId}:
    get:
      tags: [Customer]
      operationId: getCustomer
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: Customer visible to the current actor.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Customer'}
        '401': {$ref: '#/components/responses/ApiError'}
        '404': {$ref: '#/components/responses/ApiError'}
    patch:
      tags: [Customer]
      operationId: updateCustomer
      parameters: [{$ref: '#/components/parameters/CustomerId'}]
      requestBody: {$ref: '#/components/requestBodies/BusinessPayload'}
      responses: {'200': {$ref: '#/components/responses/BusinessPayload'}, '409': {$ref: '#/components/responses/ApiError'}}
  /api/v1/customers/{customerId}/deal-requests:
    post:
      tags: [DealRequest]
      operationId: requestCustomerDeal
      parameters:
        - $ref: '#/components/parameters/CustomerId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Pending request created. No business body is accepted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DealRequest'}
        '400': {$ref: '#/components/responses/ApiError'}
        '401': {$ref: '#/components/responses/ApiError'}
        '403': {$ref: '#/components/responses/ApiError'}
        '409': {$ref: '#/components/responses/ApiError'}
  /api/v1/admin/deal-requests:
    get:
      tags: [DealRequest]
      operationId: listDealRequests
      parameters:
