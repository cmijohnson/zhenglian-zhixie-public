spring:
  jpa:
    properties:
      hibernate:
        format_sql: false
  mvc:
    problemdetails:
      enabled: false

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN

app:
  mcp:
    issuer: ${MCP_ISSUER:https://127.0.0.1}
    resource-uri: ${MCP_RESOURCE_URI:https://127.0.0.1/mcp}
    allowed-origins: ${MCP_ALLOWED_ORIGINS:https://127.0.0.1}
    allowed-hosts: ${MCP_ALLOWED_HOSTS:127.0.0.1}
