name: cloud-java-ci

on:
  push:
    paths:
      - "backend/**"
      - "frontend/**"
      - "android-app/**"
      - "ios-app/**"
      - "contracts/**"
      - "scripts/verify-mobile-contract.sh"
      - "scripts/check-mobile-client-contract.py"
      - "docker-compose.yml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "android-app/**"
      - "ios-app/**"
      - "contracts/**"
      - "scripts/verify-mobile-contract.sh"
      - "scripts/check-mobile-client-contract.py"
      - "docker-compose.yml"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  mobile-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/verify-mobile-contract.sh contracts/mobile-api.yaml
      - run: python3 scripts/check-mobile-client-contract.py

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
      - run: npm run build

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: >-
          ./gradlew --no-daemon
          testDebugUnitTest
          lintDebug
          assembleDebug
          assembleRelease
          verifyReleaseRoleBounded
          verifyMobileContractCatalog

  ios-core:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path ios-app
      - run: >-
          xcodebuild
          -project ios-app/YinggeCloud.xcodeproj
          -scheme YinggeCloud
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -configuration Debug
          -derivedDataPath "${RUNNER_TEMP}/yingge-ios-derived"
          CODE_SIGNING_ALLOWED=NO
          build
