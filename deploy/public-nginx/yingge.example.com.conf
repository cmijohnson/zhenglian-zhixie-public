# Production virtual host for the public FRP server.
# Prerequisites:
# - DNS yingge.example.com -> this server
# - FRP TCP proxy 127.0.0.1:38080 -> 127.0.0.1:8080
# - a publicly trusted certificate at the paths below

map $http_upgrade $yingge_connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name yingge.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/yingge-acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yingge.example.com;

    ssl_certificate     /etc/letsencrypt/live/yingge.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yingge.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:38080;
        include /etc/nginx/snippets/yingge-mcp-proxy.conf;
    }
}
