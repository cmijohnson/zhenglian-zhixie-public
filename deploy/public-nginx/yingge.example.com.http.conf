# Temporary HTTP-only virtual host for ACME HTTP-01 validation.
# Install under /www/server/panel/vhost/nginx before requesting the certificate.

server {
    listen 80;
    listen [::]:80;
    server_name yingge.example.com;

    access_log /www/wwwlogs/yingge.example.com.log;
    error_log  /www/wwwlogs/yingge.example.com.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/yingge.example.com;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:38080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        client_max_body_size 25m;
    }
}
