services:
  gateway:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx-https.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${TLS_CERT_PATH:?TLS_CERT_PATH is required}:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_KEY_PATH:?TLS_KEY_PATH is required}:/etc/nginx/tls/privkey.pem:ro
    environment:
      APP_SERVER_NAME: ${APP_SERVER_NAME:?APP_SERVER_NAME is required}
  backend:
    environment:
      SESSION_COOKIE_SECURE: "true"
